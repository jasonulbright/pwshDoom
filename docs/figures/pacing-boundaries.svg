<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="740" viewBox="0 0 1280 740" role="img" aria-labelledby="title desc">
  <title id="title">Doom's simulation, terminal, and display rates are different measurements</title>
  <desc id="desc">A five-stage path from the 35 Hz PowerShell simulation through frame rendering, ANSI writes, Windows Terminal, and display presentation. Three separate test cards show a 28-second live Terminal run, a maximized PresentMon replay, and a 120-second headless audio run. Their measured rates are not combined because the workloads and measurement stages differ.</desc>
  <defs>
    <style>
      .ink{fill:#17212b;font-family:'Segoe UI',Arial,sans-serif}
      .muted{fill:#52616d;font-family:'Segoe UI',Arial,sans-serif}
      .box{fill:#f4f7f9;stroke:#cbd5dc;stroke-width:2}
      .sim{fill:#d9f2eb;stroke:#26836f;stroke-width:2}
      .term{fill:#e2eefc;stroke:#3c6fa8;stroke-width:2}
      .display{fill:#efe6fb;stroke:#7856a6;stroke-width:2}
      .audio{fill:#fff0d4;stroke:#a96b08;stroke-width:2}
      .pipe{stroke:#81909b;stroke-width:3;fill:none;marker-end:url(#arrow)}
    </style>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#81909b"/>
    </marker>
  </defs>
  <rect width="1280" height="740" fill="#ffffff"/>
  <text class="ink" x="48" y="54" font-size="30" font-weight="700">One game, several clocks</text>
  <text class="muted" x="48" y="84" font-size="17">Measure each boundary separately; a fast counter upstream cannot certify the display downstream.</text>

  <g font-size="17" text-anchor="middle">
    <rect class="sim" x="48" y="118" width="205" height="94" rx="12"/>
    <text class="ink" x="150" y="153" font-weight="700">PowerShell simulation</text>
    <text class="muted" x="150" y="182">35 game tics / second</text>

    <path class="pipe" d="M260 165 H288"/>
    <rect class="box" x="300" y="118" width="205" height="94" rx="12"/>
    <text class="ink" x="402" y="153" font-weight="700">Render workers</text>
    <text class="muted" x="402" y="182">software image complete</text>

    <path class="pipe" d="M512 165 H540"/>
    <rect class="term" x="552" y="118" width="205" height="94" rx="12"/>
    <text class="ink" x="654" y="153" font-weight="700">ANSI output</text>
    <text class="muted" x="654" y="182">bytes written by host</text>

    <path class="pipe" d="M764 165 H792"/>
    <rect class="term" x="804" y="118" width="205" height="94" rx="12"/>
    <text class="ink" x="906" y="153" font-weight="700">Windows Terminal</text>
    <text class="muted" x="906" y="182">text processed</text>

    <path class="pipe" d="M1016 165 H1044"/>
    <rect class="display" x="1056" y="118" width="176" height="94" rx="12"/>
    <text class="ink" x="1144" y="153" font-weight="700">Monitor</text>
    <text class="muted" x="1144" y="182">display transition</text>
  </g>

  <text class="ink" x="48" y="263" font-size="22" font-weight="700">Measured examples</text>
  <text class="muted" x="48" y="289" font-size="15">Different runs and workloads: compare the measured boundary, not just the number.</text>

  <g>
    <rect class="box" x="48" y="315" width="376" height="330" rx="16"/>
    <rect x="48" y="315" width="376" height="12" rx="6" fill="#3c6fa8"/>
    <text class="ink" x="72" y="365" font-size="20" font-weight="700">Live Windows Terminal · 28 s</text>
    <text class="muted" x="72" y="397" font-size="15">Classic · E1M1 · effects and music</text>
    <text class="muted" x="72" y="449" font-size="14" font-weight="700">SIMULATION</text>
    <text class="ink" x="72" y="484" font-size="30" font-weight="700">34.959</text>
    <text class="muted" x="194" y="484" font-size="16">tics / second</text>
    <line x1="72" y1="508" x2="400" y2="508" stroke="#d8e0e5" stroke-width="2"/>
    <text class="muted" x="72" y="544" font-size="14" font-weight="700">HOST TERMINAL UPDATES</text>
    <text class="ink" x="72" y="580" font-size="30" font-weight="700">59.670</text>
    <text class="muted" x="194" y="580" font-size="16">completed / second</text>
    <text x="72" y="616" font-size="14" fill="#8a4a14" font-family="Segoe UI,Arial,sans-serif" font-weight="700">Not a monitor-presentation count</text>

    <rect class="box" x="452" y="315" width="376" height="330" rx="16"/>
    <rect x="452" y="315" width="376" height="12" rx="6" fill="#7856a6"/>
    <text class="ink" x="476" y="365" font-size="20" font-weight="700">PresentMon · maximized replay</text>
    <text class="muted" x="476" y="397" font-size="15">Classic · E1M1 · no audio · one trial</text>
    <text class="muted" x="476" y="449" font-size="14" font-weight="700">SIMULATION</text>
    <text class="ink" x="476" y="484" font-size="30" font-weight="700">34.977</text>
    <text class="muted" x="598" y="484" font-size="16">active tics / second</text>
    <line x1="476" y1="508" x2="804" y2="508" stroke="#d8e0e5" stroke-width="2"/>
    <text class="muted" x="476" y="544" font-size="14" font-weight="700">DISPLAY TRANSITIONS</text>
    <text class="ink" x="476" y="580" font-size="30" font-weight="700">47.73</text>
    <text class="muted" x="576" y="580" font-size="16">transitions / second</text>
    <text x="476" y="616" font-size="14" fill="#8a4a14" font-family="Segoe UI,Arial,sans-serif" font-weight="700">Not proof of unique Doom images</text>

    <rect class="box" x="856" y="315" width="376" height="330" rx="16"/>
    <rect x="856" y="315" width="376" height="12" rx="6" fill="#26836f"/>
    <text class="ink" x="880" y="365" font-size="20" font-weight="700">Headless audio host · 120 s</text>
    <text class="muted" x="880" y="397" font-size="15">E1M1 · 16 render workers · full music catalog</text>
    <text class="muted" x="880" y="449" font-size="14" font-weight="700">SIMULATION</text>
    <text class="ink" x="880" y="484" font-size="30" font-weight="700">34.991</text>
    <text class="muted" x="1002" y="484" font-size="16">tics / second</text>
    <line x1="880" y1="508" x2="1208" y2="508" stroke="#d8e0e5" stroke-width="2"/>
    <text class="muted" x="880" y="544" font-size="14" font-weight="700">HEADLESS HOST UPDATES</text>
    <text class="ink" x="880" y="580" font-size="30" font-weight="700">48.258</text>
    <text class="muted" x="1002" y="580" font-size="16">completed / second</text>
    <text x="880" y="616" font-size="14" fill="#27675a" font-family="Segoe UI,Arial,sans-serif" font-weight="700">5.29M frames returned · no display measured</text>
  </g>

  <rect x="48" y="674" width="1184" height="42" rx="8" fill="#fff5df"/>
  <text class="ink" x="68" y="701" font-size="15">The 35-tic/60-display goal remains open. These figures are not paired benchmark trials; do not combine their rates into an FPS claim.</text>
</svg>
